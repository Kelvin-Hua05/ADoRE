[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adore-doe"
version = "0.1.0.dev0"
description = "ADoRE-DoE: Adaptive Design of Experiments with Residual Enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kelvin-Hua05" }]
# ADR-008: minimal core dependencies (numpy, scipy, pandas); everything else is an extra
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
ml = ["scikit-learn>=1.3"]
stats = ["statsmodels>=0.14"]
dev = ["pytest>=7", "matplotlib>=3.7", "scikit-learn>=1.3", "statsmodels>=0.14"]

[project.urls]
Homepage = "https://github.com/Kelvin-Hua05/ADoRE-DoE"
Issues = "https://github.com/Kelvin-Hua05/ADoRE-DoE/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
